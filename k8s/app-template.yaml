apiVersion: apps/v1
kind: Deployment
metadata:
  name: bao-nodejs-cicd-demo
  namespace: __NAMESPACE__
  labels:
    app: bao-nodejs-cicd-demo
    environment: __NAMESPACE__
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: bao-nodejs-cicd-demo
  template:
    metadata:
      labels:
        app: bao-nodejs-cicd-demo
        environment: __NAMESPACE__
    spec:
      containers:
        - name: bao-nodejs-cicd-demo
          image: __IMAGE_URI__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: bao-nodejs-cicd-demo-svc
  namespace: __NAMESPACE__
  labels:
    app: bao-nodejs-cicd-demo
spec:
  type: __SERVICE_TYPE__
  selector:
    app: bao-nodejs-cicd-demo
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
