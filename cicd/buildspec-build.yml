version: 0.2

phases:
  pre_build:
    commands:
      - echo "[CI] Xac dinh tai khoan, image tag va dang nhap ECR"
      - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - REPO_URI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO"
      - IMAGE_TAG=$(printf '%s' "$CODEBUILD_RESOLVED_SOURCE_VERSION" | cut -c 1-7)
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
  build:
    commands:
      - echo "[CI] Build $REPO_URI:$IMAGE_TAG"
      - docker build --pull -t "$REPO_URI:$IMAGE_TAG" -t "$REPO_URI:latest" .
  post_build:
    commands:
      - echo "[CI] Push image bat bien theo Git commit"
      - docker push "$REPO_URI:$IMAGE_TAG"
      - docker push "$REPO_URI:latest"
      - printf 'IMAGE_URI=%s:%s\nIMAGE_TAG=%s\n' "$REPO_URI" "$IMAGE_TAG" "$IMAGE_TAG" > image.env
      - cat image.env

artifacts:
  files:
    - image.env
    - k8s/**/*
    - cicd/**/*
